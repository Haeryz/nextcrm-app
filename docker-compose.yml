name: ${COMPOSE_PROJECT_NAME:-nextcrm}

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Public edge. Only Traefik publishes host ports; the app and database remain
  # isolated on Docker networks.
  traefik:
    image: traefik:v3.7.1
    restart: unless-stopped
    init: true
    command:
      - --api.dashboard=false
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --accesslog=true
      - --ping=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${TRAEFIK_NETWORK:-nextcrm-proxy}
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?Set TRAEFIK_ACME_EMAIL in .env.production}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - target: 80
        published: "80"
        protocol: tcp
        mode: host
      - target: 443
        published: "443"
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/letsencrypt
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  # Supabase's PostgreSQL distribution includes pgvector and the extensions
  # expected by Supabase while remaining fully compatible with Prisma.
  supabase:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-nextcrm}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    volumes:
      - supabase_data:/var/lib/postgresql/data
      - ./docker/supabase/init/00-extensions.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    networks:
      - backend
    shm_size: 256mb
    stop_grace_period: 1m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d \"$${POSTGRES_DB}\" -h 127.0.0.1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  # The application image is built from the repository's multi-stage
  # Dockerfile. Prisma migrations run in its existing entrypoint before boot.
  appbuild:
    image: ${APP_IMAGE:-nextcrm-app}:${APP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    init: true
    env_file:
      - path: ./.env.production
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@supabase:5432/${POSTGRES_DB:-nextcrm}?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@supabase:5432/${POSTGRES_DB:-nextcrm}?schema=public
      NEXTAUTH_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
      NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env.production}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY:?Set EMAIL_ENCRYPTION_KEY in .env.production}
    depends_on:
      supabase:
        condition: service_healthy
    networks:
      - backend
      - proxy
    shm_size: 256mb
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512m,mode=1777
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-nextcrm-proxy}
      traefik.http.routers.nextcrm.rule: Host(`${APP_DOMAIN:?Set APP_DOMAIN in .env.production}`)
      traefik.http.routers.nextcrm.entrypoints: websecure
      traefik.http.routers.nextcrm.tls: "true"
      traefik.http.routers.nextcrm.tls.certresolver: letsencrypt
      traefik.http.routers.nextcrm.middlewares: nextcrm-compress,nextcrm-security
      traefik.http.services.nextcrm.loadbalancer.server.port: "3000"
      traefik.http.services.nextcrm.loadbalancer.healthcheck.path: /
      traefik.http.services.nextcrm.loadbalancer.healthcheck.interval: 30s
      traefik.http.services.nextcrm.loadbalancer.healthcheck.timeout: 10s
      traefik.http.middlewares.nextcrm-compress.compress: "true"
      traefik.http.middlewares.nextcrm-security.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.nextcrm-security.headers.frameDeny: "true"
      traefik.http.middlewares.nextcrm-security.headers.referrerPolicy: strict-origin-when-cross-origin
      traefik.http.middlewares.nextcrm-security.headers.stsSeconds: "31536000"
      traefik.http.middlewares.nextcrm-security.headers.stsIncludeSubdomains: "true"
    logging: *default-logging

networks:
  backend:
    internal: true
  proxy:
    name: ${TRAEFIK_NETWORK:-nextcrm-proxy}

volumes:
  supabase_data:
  traefik_acme:
